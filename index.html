function downloadCsv(filename,rows){if(!rows.length)return alert('لا توجد بيانات للتصدير');const keys=Object.keys(rows[0]);const body=[keys.map(csvEscape).join(','),...rows.map(r=>keys.map(k=>csvEscape(r[k])).join(','))].join('\n');const blob=new Blob([String.fromCharCode(0xFEFF)+body],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCsv(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(ch===','&&!quote){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);if(!rows.length)return[];const heads=rows.shift().map(x=>x.trim());return rows.map(r=>Object.fromEntries(heads.map((h,i)=>[h,(r[i]??'').trim()])))}

async function showStockCard(){const box=$('#stockCardBox');if(!box)return;const p=v('scprod');if(!p)return alert('اختر الصنف');box.innerHTML='<p class="muted">جاري التحميل...</p>';try{const from=v('scfrom')||'1900-01-01',to=v('scto')||new Date().toISOString().slice(0,10),rows=await rpc('product_stock_card',{p_product:p,p_warehouse:v('scwh')||null,p_from:from,p_to:to});box.innerHTML=rows.length?T(['التاريخ','المخزن','الحركة','الكمية','قبل','بعد','المستند'],rows.map(x=>[x.movement_date,e(by(C.warehouses,x.warehouse_id).name),e(x.movement_type),fmt(x.qty),fmt(x.qty_before),fmt(x.qty_after),e(x.doc_type||'—')])):'<div class="empty">لا توجد حركات.</div>'}catch(x){box.innerHTML='<div class="bad">'+e(x.message||x)+'</div>'}}

async function runFinalSuite(){return withLoading(async()=>{
  const box=$('#enterpriseTestBox');
  box.innerHTML='<p>جاري تشغيل فحص Go-Live النهائي...</p>';
  try{
    const r=await rpc('run_final_go_live_suite',{});
    const pre=r.preflight||{};
    const rows=[
      ['enterprise',r.enterprise?.ok===true],
      ['advanced inventory',r.advanced?.ok===true],
      ['RLS enabled on public tables',+(pre.rls_missing_tables||0)===0],
      ['no anon table privileges',+(pre.anon_table_privileges||0)===0],
      ['no anon-executable functions',+(pre.anon_executable_functions||0)===0],
      ['security-definer guards',+(pre.weak_security_definer_functions||0)===0],
      ['journal balanced',+(pre.unbalanced_journal_entries||0)===0],
      ['invoice paid sync',+(pre.sales_paid_mismatches||0)===0 && +(pre.purchase_paid_mismatches||0)===0],
      ['serial / lot integrity',+(pre.invalid_serial_rows||0)===0 && +(pre.negative_lot_balances||0)===0],
      ['test data cleaned',+(pre.test_data_residue||0)===0] 
    ];
    box.innerHTML=`<div class="test-summary ${r.ok?'ok':'fail'}">${r.ok?'نجح فحص Go-Live النهائي':'ما زال يحتاج معالجة'}</div>`+rows.map(x=>`<div class="test-row ${x[1]?'pass':'fail'}"><span>${x[1]?'✓':'✗'}</span><b>${e(x[0])}</b><small></small></div>`).join('')+(r.stage?`<p class="muted">المرحلة: ${e(r.stage)}</p>`:'');
  }catch(x){box.innerHTML=`<div class="bad">${e(x.message||x)}</div>`}
},'جاري فحص Go-Live النهائي...','يتم اختبار الأمان والعمليات والتكاملات')}

async function loadPayrollAdjustments(){
  const emp=v('pe'),mon=v('pmo');
  if(!emp||!mon)return;
  try{
    const r=await rpc('employee_adjustment_totals',{p_employee:emp,p_month:mon+'-01'});
    const row=Array.isArray(r)?r[0]:r;
    if($('#pbn'))$('#pbn').value=+(row?.rewards||0);
    if($('#pd'))$('#pd').value=+(row?.penalties||0);

  }catch(x){toast('تعذر تحميل المكافآت والجزاءات المعتمدة')}
}

let permEditorUser=null,permEditorMode='role',permEditorSet=new Set();
async function openPermissionEditor(id){const r=await rpc('admin_get_user_permissions',{p_user:id});if(!r)throw Error('تعذر تحميل الصلاحيات');permEditorUser=id;permEditorMode=r.mode||'role';permEditorSet=new Set(Array.isArray(r.permissions)?r.permissions:[]);R()}
function togglePerm(key,checked){if(checked)permEditorSet.add(key);else permEditorSet.delete(key)}
async function savePermissionEditor(){if(!permEditorUser)return;await act(async()=>{await rpc('save_user_permissions',{p_user:permEditorUser,p_permissions:[...permEditorSet]});await openPermissionEditor(permEditorUser)});toast('تم حفظ الصلاحيات المخصصة')}
async function resetPermissionEditor(){if(!permEditorUser)return;await act(async()=>{await rpc('reset_user_permissions',{p_user:permEditorUser});await openPermissionEditor(permEditorUser)});toast('تم إرجاع المستخدم لصلاحيات الدور الأساسي')}
async function usersView(){
  const L=await g('profiles','created_at');
  const target=L.find(x=>x.id===permEditorUser);
  const editor=target&&target.role!=='admin'?`<div class="card"><div class="card-title"><div><b>تخصيص الصلاحيات: ${e(target.name)}</b><div class="muted">الدور الأساسي: ${e(target.role)} · التخصيص هنا يضيّق صلاحيات الدور ولا يوسعها.</div></div><span class="chip ${permEditorMode==='custom'?'warning':'success'}">${permEditorMode==='custom'?'مخصص':'حسب الدور'}</span></div>${PERMISSION_GROUPS.map(([title,items])=>`<div class="perm-group"><h4>${title}</h4><div class="perm-grid">${items.map(([id,label])=>{const allowed=canBaseForRole(target.role,id);const checked=permEditorSet.has(id);return `<label class="perm-item ${allowed?'':'disabled'}"><input type="checkbox" ${checked?'checked':''} ${allowed?'':'disabled'} onchange="togglePerm('${id}',this.checked)"><span>${label}</span>${allowed?'':'<small>خارج الدور</small>'}</label>`}).join('')}</div></div>`).join('')}<div class="row"><button class="btn" onclick="savePermissionEditor()">حفظ التخصيص</button><button class="btn soft" onclick="resetPermissionEditor()">إرجاع لصلاحيات الدور</button></div></div>`:'';
  return `${sectionHead('المستخدمون والصلاحيات','الدور الأساسي يحدد الحد الأعلى، والتخصيص يختار ما يظهر لهذا المستخدم.')}
  <div class="card">${T(['الاسم','البريد','الدور الأساسي','الوضع','مفعّل','التخصيص'],L.map(u=>[e(u.name),e(u.username),u.role==='admin'?'<b>admin</b>':`<select ${u.id===me.id?'disabled':''} onchange="act(()=>upd('profiles','${u.id}',{role:this.value}))">${['accountant','sales','store'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('')}</select>`,chip(u.role==='admin'?'كامل':(u.permissions_mode==='custom'?'مخصص':'حسب الدور'),u.role==='admin'?'success':u.permissions_mode==='custom'?'warning':'info'),`<input type="checkbox" ${u.active?'checked':''} ${u.id===me.id?'disabled':''} onchange="act(()=>upd('profiles','${u.id}',{active:this.checked}))">`,u.role==='admin'?'<span class="muted">صلاحيات المدير كاملة</span>':`<button class="btn soft" onclick="openPermissionEditor('${u.id}')">تخصيص</button>`]))}</div>${editor}`;
}

  localStorage.setItem('erp_v_view',view);
  await loadAll();
  let h='';
  try{
    if(view==='dash')h=await dash(); else if(view==='po')h=await poView(); else if(view==='grn')h=await grnView(); else if(view==='dn')h=await dnView();
    else if(view==='asset')h=await assetView(); else if(view==='bank')h=await bankView(); else if(view==='price')h=await priceView();
    else if(view==='hr')h=await hrView(); else if(view==='mfg')h=await mfgView(); else if(view==='pos')h=await posView(); else if(view==='proj')h=await projView(); else if(view==='period')h=await periodView();
    else if(view==='trace')h=await traceView(); else if(view==='data')h=await dataView(); else if(view==='health')h=await healthView(); else if(view==='rep')h=await reportsView(); else if(view==='jr')h=await accountsView(); else if(view==='users')h=await usersView();
    else if(view==='appr')h=await approvalView(); else if(view==='chk')h=await chequeView(); else if(view==='comm')h=await commissionView(); else if(view==='taxdoc')h=await taxdocView(); else if(view==='int')h=await integrationsView(); else if(view==='org')h=await orgView(); else h=await legacyHtml();
    if(!h)h='<div class="card">صفحة غير متاحة.</div>';
  }catch(x){h=`<div class="card error-card"><b>تعذر تحميل الصفحة</b><p>${e(x.message||x)}</p></div>`}
  const links=renderNavGroups();
  $('#app').innerHTML=`<div class="mobile-overlay" onclick="closeMobileNav()"></div><aside class="sidebar"><div class="brandbox"><div class="brandmark">E</div><div><b>ERP Enterprise</b><small>Finance · Inventory · Operations</small></div></div><div class="userbox"><div class="avatar">${e((me.name||'U').slice(0,1))}</div><div><b>${e(me.name)}</b><small>${e(me.role)}</small></div></div><nav>${links}</nav><div class="side-bottom"><button class="sidebtn danger-link" onclick="closeMobileNav();logout()">تسجيل الخروج</button></div></aside><main class="shell"><header class="topbar"><button class="mobile-menu-btn" onclick="openMobileNav()" aria-label="فتح القائمة">☰</button><div class="top-search"><span>⌕</span><input placeholder="بحث سريع في النظام" onkeydown="if(event.key==='Enter'){window._q=this.value;go('prod')}"/></div><div class="top-actions"><div id="netStatus"></div>${me.role==='admin'?'<button class="iconbtn" title="فحص الجاهزية" onclick="go(\'health\')">✓</button>':''}<button class="role-pill">${e(me.role)}</button></div></header><div class="page">${h}</div><div class="mobile-bottom">${NAV.filter(x=>can(x[0])).filter(x=>['dash','sales','purch','pay','trace'].includes(x[0])).map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></main>`;
  if(q){const i=$('#q');if(i){i.focus();i.setSelectionRange(99,99)}}
  updateOnlineStatus();
}
function _loginScreen(){$('#app').innerHTML=`<div class="login-page"><section class="login-card"><div class="login-brand"><div class="brandmark">E</div><div><b>ERP Enterprise</b><small>منظومة إدارة الأعمال</small></div></div><h2>تسجيل الدخول</h2><p class="login-sub">ادخل إلى لوحة إدارة الشركة</p><div class="login-field"><label for="lu">البريد الإلكتروني</label><input id="lu" type="email" autocomplete="email" placeholder="name@company.com"></div><div class="login-field"><label for="lp">كلمة المرور</label><input id="lp" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="login-actions"><button class="btn" style="width:100%;min-height:48px" onclick="login()">دخول</button><button class="btn soft" style="width:100%;min-height:48px" onclick="signup()">إنشاء حساب جديد</button></div><p class="login-note">الحساب الأول في المشروع الجديد يُنشأ كمدير حسب إعدادات قاعدة البيانات.</p></section></div>`}
function _inactiveScreen(){$('#app').innerHTML=`<div class="login-page"><section class="login-card"><div class="login-brand"><div class="brandmark">E</div><div><b>ERP Enterprise</b><small>منظومة إدارة الأعمال</small></div></div><h2>الحساب بانتظار التفعيل</h2><p class="login-sub">سيتطلب الحساب تفعيل المدير قبل استخدام النظام.</p><button class="btn" style="width:100%;min-height:48px" onclick="logout()">خروج</button></section></div>`}
async function login(){return withLoading(async()=>{const{error}=await sb.auth.signInWithPassword({email:v('lu'),password:v('lp')});if(error)throw error;await boot()},'جاري تسجيل الدخول...','جارٍ الاتصال بالنظام بأمان')}
async function signup(){return withLoading(async()=>{const{error}=await sb.auth.signUp({email:v('lu'),password:v('lp')});if(error)throw error;alert('تم إنشاء الحساب. أكد البريد إذا كان التأكيد مفعلاً.')},'جاري إنشاء الحساب...','جارٍ تجهيز حسابك')}
async function logout(){return withLoading(async()=>{await sb.auth.signOut();me=null;localStorage.removeItem('erp_v_view');view='dash';await R()},'جاري تسجيل الخروج...','جارٍ إنهاء الجلسة بأمان')}
async function boot(){const{data:{user}}=await sb.auth.getUser();me=null;if(user){const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(!error)me=data}if(me)await loadMyPermissions();await R()}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeMobileNav()});
window.addEventListener('pageshow',()=>{ hideLoader(); });
window.addEventListener('unhandledrejection',()=>{ if(_loading) hideLoader(); });
window.addEventListener('error',()=>{ if(_loading) hideLoader(); });

// ERP Business V15 — compact sidebar + settings management + custom user permissions.
// Initial app boot: show the loader only while the first session/profile request is actually running.
cacheAppShell();
withLoading(()=>boot(),'جاري تشغيل النظام...','جارٍ التحقق من جلسة الدخول وتحميل الإعدادات');
document.querySelector('#globalLoader')?.classList.add('show');
sb.auth.getSession().then(boot).catch(err=>{const b=document.querySelector('#globalLoader');b?.classList.remove('show');alert(err?.message||err)});
</script>
