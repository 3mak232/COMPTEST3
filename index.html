function csvEscape(x){const s=String(x??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
async function exportData(kind){const rows=await g(kind,'created_at');downloadCsv(kind+'.csv',rows)}
function downloadTemplate(kind){const templates={products:[{name:'',code:'',barcode:'',category:'',unit:'',purchase_price:'',sale_price:'',wholesale_price:'',min_stock:'',reorder_qty:'',safety_stock:'',lead_time_days:'',notes:''}],customers:[{name:'',phone:'',email:'',address:'',credit_limit:'',payment_terms_days:'',opening_balance:'',notes:''}],suppliers:[{name:'',phone:'',email:'',address:'',payment_terms_days:'',opening_balance:'',notes:''}],opening_stock:[{code:'',qty:''}]};downloadCsv(kind+'_template.csv',templates[kind]||[])}
function downloadCsv(filename,rows){if(!rows.length)return alert('لا توجد بيانات للتصدير');const keys=Object.keys(rows[0]);const body=[keys.map(csvEscape).join(','),...rows.map(r=>keys.map(k=>csvEscape(r[k])).join(','))].join('\n');const blob=new Blob([String.fromCharCode(0xFEFF)+body],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCsv(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(ch===','&&!quote){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);if(!rows.length)return[];const heads=rows.shift().map(x=>x.trim());return rows.map(r=>Object.fromEntries(heads.map((h,i)=>[h,(r[i]??'').trim()])))}
async function importCsv(kind,input){const file=input.files?.[0];if(!file)return;const text=await file.text();const rows=parseCsv(text);if(!rows.length)return alert('الملف لا يحتوي صفوفًا');const count=await rpc(kind==='products'?'import_products_json':kind==='customers'?'import_customers_json':'import_suppliers_json',{p_rows:rows});alert('تم استيراد '+count+' صف');input.value='';await act(async()=>{})}
async function importOpeningStock(input){const file=input.files?.[0];if(!file)return;const wh=v('osw');if(!wh)return alert('اختر المخزن');const rows=parseCsv(await file.text());if(!rows.length)return alert('الملف لا يحتوي صفوفًا');const count=await rpc('import_opening_stock_json',{p_warehouse:wh,p_rows:rows});alert('تم استيراد '+count+' رصيد');input.value='';await loadAll();await R()}

async function showInventoryAvailability(){const box=$('#availabilityBox');if(!box)return;box.innerHTML='<p class="muted">جاري التحميل...</p>';try{const rows=await rpc('inventory_availability',{p_warehouse:v('iavw')||null});box.innerHTML=rows.length?T(['الصنف','المخزن','المتاح','الحد الأدنى','كمية إعادة الطلب','العجز','الحالة'],rows.slice(0,300).map(x=>[e(x.product_name),e(x.warehouse_name),fmt(x.on_hand),fmt(x.min_stock),fmt(x.reorder_qty),fmt(x.shortage_qty),chip(x.status,x.status==='متوفر'?'success':x.status==='عجز'?'warning':'danger')])):'<div class="empty success">لا يوجد عجز حاليًا.</div>'}catch(x){box.innerHTML='<div class="bad">'+e(x.message||x)+'</div>'}}
async function showStockCard(){const box=$('#stockCardBox');if(!box)return;const p=v('scprod');if(!p)return alert('اختر الصنف');box.innerHTML='<p class="muted">جاري التحميل...</p>';try{const from=v('scfrom')||'1900-01-01',to=v('scto')||new Date().toISOString().slice(0,10),rows=await rpc('product_stock_card',{p_product:p,p_warehouse:v('scwh')||null,p_from:from,p_to:to});box.innerHTML=rows.length?T(['التاريخ','المخزن','الحركة','الكمية','قبل','بعد','المستند'],rows.map(x=>[x.movement_date,e(by(C.warehouses,x.warehouse_id).name),e(x.movement_type),fmt(x.qty),fmt(x.qty_before),fmt(x.qty_after),e(x.doc_type||'—')])):'<div class="empty">لا توجد حركات.</div>'}catch(x){box.innerHTML='<div class="bad">'+e(x.message||x)+'</div>'}}

async function runFinalSuite(){return withLoading(async()=>{
  const box=$('#enterpriseTestBox');
  box.innerHTML='<p>جاري تشغيل فحص Go-Live النهائي...</p>';
  try{
    const r=await rpc('run_final_go_live_suite',{});
    const pre=r.preflight||{};
    const rows=[
      ['enterprise',r.enterprise?.ok===true],
      ['advanced inventory',r.advanced?.ok===true],
      ['RLS enabled on public tables',+(pre.rls_missing_tables||0)===0],
      ['no anon table privileges',+(pre.anon_table_privileges||0)===0],
      ['no anon-executable functions',+(pre.anon_executable_functions||0)===0],
      ['security-definer guards',+(pre.weak_security_definer_functions||0)===0],
      ['journal balanced',+(pre.unbalanced_journal_entries||0)===0],
      ['invoice paid sync',+(pre.sales_paid_mismatches||0)===0 && +(pre.purchase_paid_mismatches||0)===0],
      ['serial / lot integrity',+(pre.invalid_serial_rows||0)===0 && +(pre.negative_lot_balances||0)===0],
      ['test data cleaned',+(pre.test_data_residue||0)===0] 
    ];
    box.innerHTML=`<div class="test-summary ${r.ok?'ok':'fail'}">${r.ok?'نجح فحص Go-Live النهائي':'ما زال يحتاج معالجة'}</div>`+rows.map(x=>`<div class="test-row ${x[1]?'pass':'fail'}"><span>${x[1]?'✓':'✗'}</span><b>${e(x[0])}</b><small></small></div>`).join('')+(r.stage?`<p class="muted">المرحلة: ${e(r.stage)}</p>`:'');
  }catch(x){box.innerHTML=`<div class="bad">${e(x.message||x)}</div>`}
},'جاري فحص Go-Live النهائي...','يتم اختبار الأمان والعمليات والتكاملات')}

async function loadPayrollAdjustments(){
  const emp=v('pe'),mon=v('pmo');
  if(!emp||!mon)return;
  try{
    const r=await rpc('employee_adjustment_totals',{p_employee:emp,p_month:mon+'-01'});
    const row=Array.isArray(r)?r[0]:r;
    if($('#pbn'))$('#pbn').value=+(row?.rewards||0);
    if($('#pd'))$('#pd').value=+(row?.penalties||0);
    toast('تم تحميل المكافآت والجزاءات المعتمدة للشهر');
  }catch(x){toast('تعذر تحميل المكافآت والجزاءات المعتمدة')}
}

let permEditorUser=null,permEditorMode='role',permEditorSet=new Set();

function togglePerm(key,checked){if(checked)permEditorSet.add(key);else permEditorSet.delete(key)}

async function usersView(){
  const L=(await g('profiles','created_at')).filter(u=>me.isDev||u.role!=='developer');

  return `${sectionHead('المستخدمون والصلاحيات','الدور الأساسي يحدد الحد الأعلى، والتخصيص يختار ما يظهر لهذا المستخدم.')}
  ${me.role==='admin'?addUserCard():''}
  <div class="card">${T(['الاسم','البريد','الدور الأساسي','الوضع','مفعّل','التخصيص'],L.map(u=>[e(u.name),e(u.username),(u.role==='admin'||u.role==='developer')?'<b>admin</b>':`<select ${u.id===me.id?'disabled':''} onchange="act(()=>upd('profiles','${u.id}',{role:this.value}))">${(me.isDev?['accountant','sales','store','developer']:['accountant','sales','store']).map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('')}</select>`,chip((u.role==='admin'||u.role==='developer')?'كامل':(u.permissions_mode==='custom'?'مخصص':'حسب الدور'),(u.role==='admin'||u.role==='developer')?'success':u.permissions_mode==='custom'?'warning':'info'),`<input type="checkbox" ${u.active?'checked':''} ${u.id===me.id?'disabled':''} onchange="act(()=>upd('profiles','${u.id}',{active:this.checked}))">`,(u.role==='admin'||u.role==='developer')?'<span class="muted">صلاحيات المدير كاملة</span>':`<button class="btn soft" onclick="openPermissionEditor('${u.id}')">تخصيص</button>`]))}</div>${editor}`;

function invStatus(x){
  if(x.status==='Void')return ['ملغاة','danger'];
  if(Number(x.outstanding)<=0)return ['مدفوعة','success'];
  if(Number(x.allocated_paid)>0)return ['مدفوعة جزئياً','warning'];
  return ['آجلة','info'];
}
function invSum(k){
  const tot=(cart[k]||[]).reduce((a,l)=>a+l.qty*l.price-l.discount,0);
  const disc=Number(document.getElementById('ig')?.value||0);
  const net=Math.max(0,tot-disc);
  const paid=Math.min(net,Math.max(0,Number(document.getElementById('ipd')?.value||0)));
  const set=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t};
  set('invSub',fmt(tot));
  set('invNet',fmt(net));
  set('invPaid',fmt(paid));
  set('invRem',fmt(net-paid));
  set('docStatus',paid<=0?'آجلة':(paid>=net?'مدفوعة':'مدفوعة جزئياً'));
}

function invSet(k,i,f,val){

  else if(f==='price'){if(!(x>=0)){invRedraw(k);return}l.price=x}
  else{l.discount=x>=0&&!isNaN(x)?x:0}

function dayStrip(key,day,meta){

async function stkDetail(id){
  const{data,error}=await sb.from('stocktake_items').select('*,products(name)').eq('stocktake_id',id).order('id');
  if(error)return alert(error.message);
  const L=data||[];
  const diffs=L.reduce((a,x)=>a+Math.abs((+x.actual_qty||0)-(+x.expected_qty||0)),0);
  showModal(`<div class="card-title"><b>تفاصيل الجرد</b><span class="muted">${L.length} صنف · إجمالي الفروقات ${fmt(diffs)}</span></div>${T(['الصنف','المتوقع','الفعلي','الفرق'],L.map(x=>{const d=(+x.actual_qty||0)-(+x.expected_qty||0);return [e((x.products||{}).name||'—'),fmt(x.expected_qty),fmt(x.actual_qty),`<span class="${d<0?'bad':d>0?'good':''}">${d>0?'+':''}${fmt(d)}</span>`]}))}`,`<button class="btn soft" onclick="modalPrint('تفاصيل الجرد')">طباعة</button>`);
}
async function stocktakeView(){
  const sec=secCur('stk','new');
  const bar=secBar('stk',[['new','جرد جديد'],['hist','الجرد السابق']],'new');
  const H=await g('stocktakes','date');
  if(sec==='hist') return sectionHead('الجرد','الجرود السابقة — اضغط تفاصيل لعرض الأصناف والفروقات.')+bar+`<div class="card">${T(['رقم','التاريخ','المخزن','الحالة',''],H.slice().reverse().map(x=>[x.number,x.date,e(by(C.warehouses,x.warehouse_id).name),chip(x.status,x.status==='Approved'?'success':x.status==='Cancelled'?'danger':'warning'),`<button class="s" onclick="stkDetail('${x.id}')">تفاصيل</button>`]))}</div>`;
  let L=[];
  if(stk){const{data,error}=await sb.from('stocktake_items').select('*,products(name)').eq('stocktake_id',stk.id).order('id');if(error)throw error;L=data||[]}
  window._stkL=L;
  return sectionHead('الجرد','ابدأ جردًا لمخزن، أدخل الكميات الفعلية، ثم اعتمد.')+bar+
    `<div class="card np"><div class="row"><select id="sw">${O(C.warehouses)}</select><button onclick="act(async()=>{stk={id:await rpc('create_stocktake',{p_warehouse:v('sw')})}})">بدء جرد جديد</button></div></div>`+
    (stk?`<div class="card"><div class="card-title"><b>الجرد الحالي</b><span class="pill">جرد #${e(stk.id.slice(-6).toUpperCase())}</span></div>${T(['الصنف','المتوقع','الفعلي'],L.map((x,i)=>[e((x.products||{}).name),x.expected_qty,`<input id="sq${i}" type="number" step="0.001" value="${x.actual_qty??x.expected_qty}" style="width:100px">`]))}<button onclick="stkApprove('${stk.id}')">اعتماد الجرد</button></div>`:'<div class="card empty">لا يوجد جرد مفتوح الآن.</div>');
}

// ---------- المرتجعات: مستند قابل للطباعة + زر الحفظ يعمل ----------
window._rk=window._rk||'s';
async function loadRet(){
  const s=v('rk')==='s',id=v('ri');if(!id)return;
  const{data,error}=await sb.from(s?'sales_invoice_items':'purchase_invoice_items').select('product_id,qty,unit_price').eq('invoice_id',id);
  if(error)throw error;
  const inv=await sb.from(s?'sales_invoices':'purchase_invoices').select('number').eq('id',id).single();
  RT={s,id,number:(inv.data&&inv.data.number)||'',items:data||[]};
  R('soft');
}
async function retSave(){
  const cur=RT;if(!cur)return;
  const items=cur.items.map((x,i)=>({product_id:x.product_id,qty:n('rq'+i)})).filter(x=>x.qty>0);
  if(!items.length)return alert('اكتب كمية مرتجع لصنف واحد على الأقل');
  const tbl=cur.s?'sales_returns':'purchase_returns';
  const beforeRes=await sb.from(tbl).select('id').eq('invoice_id',cur.id);
  const before=new Set((beforeRes.data||[]).map(x=>x.id));
  await act(async()=>{await rpc(cur.s?'create_sales_return':'create_purchase_return',{p_invoice:cur.id,p_items:items});RT=null});
  const afterRes=await sb.from(tbl).select('id').eq('invoice_id',cur.id);
  const fresh=(afterRes.data||[]).find(x=>!before.has(x.id));
  if(fresh&&confirm('تم حفظ المرتجع. تطبعه الآن؟'))retPrint(fresh.id,cur.s);
}
async function retPrint(id,s){
  const t=s?'sales':'purchase';
  const h=await sb.from(t+'_returns').select('*').eq('id',id).single().then(r=>{if(r.error)throw r.error;return r.data});
  const its=await sb.from(t+'_return_items').select('*,products(name)').eq('return_id',id).then(r=>{if(r.error)throw r.error;return r.data||[]});
  const co=await g('company_settings').then(x=>x[0]||{});
  const inv=h.invoice_id?await sb.from(t+'_invoices').select('number,date').eq('id',h.invoice_id).single().then(r=>r.data||{}):{};
  const party=by(s?C.customers:C.suppliers,s?h.customer_id:h.supplier_id).name||'—';
  let tot=0;
  const rowsHtml=its.map((x,i)=>{const pr=Number(x.unit_price??x.price??0),q=Number(x.qty||0),lt=Number(x.line_total??q*pr);tot+=lt;return `<tr><td>${i+1}</td><td>${e(x.products?.name||'')}</td><td>${fmt(q)}</td><td>${fmt(pr)}</td><td>${fmt(lt)}</td></tr>`}).join('');
  const title=s?'مرتجع مبيعات':'مرتجع مشتريات';
  printHtml(title+' '+(h.number||''),`<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1d4ed8;padding-bottom:12px"><div><b style="font-size:17px">${e(co.company_name||'')}</b><div class="muted">${e(co.address||'')}${co.tax_number?'<br>الرقم الضريبي: '+e(co.tax_number):''}</div></div><div style="text-align:left"><h2>${title}</h2><div>رقم: <b>${e(h.number||'')}</b></div><div>التاريخ: ${e(h.date||'')}</div>${inv.number?`<div>من الفاتورة: ${e(inv.number)}</div>`:''}</div></div>
  <p><b>${s?'العميل':'المورد'}:</b> ${e(party)}</p>
  <table><thead><tr><th>#</th><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${rowsHtml}</tbody></table>
  <p class="tot" style="text-align:left">الإجمالي: ${fmt(h.total??tot)}</p>
  <div style="display:flex;justify-content:space-between;margin-top:40px"><div style="border-top:1px solid #98a2b3;width:200px;text-align:center;padding-top:6px">توقيع المستلم</div><div style="border-top:1px solid #98a2b3;width:200px;text-align:center;padding-top:6px">توقيع المسؤول</div></div>`);
}
async function retView(){
  const sel=window._rk!=='p';
  const[SI,PI,RS]=await Promise.all([g('sales_invoices','date'),g('purchase_invoices','date'),g(sel?'sales_returns':'purchase_returns','date')]);
  const L=sel?SI:PI;
  const cur=(RT&&RT.s===sel)?RT:null;
  const itemsHtml=cur?`<div class="card np"><div class="card-title"><b>بنود الفاتورة ${e(cur.number)}</b><span class="muted">اكتب الكمية المرتجعة لكل صنف ثم احفظ</span></div>${T(['الصنف','الكمية في الفاتورة','سعر الوحدة','كمية المرتجع'],cur.items.map((x,i)=>[e((by(C.products,x.product_id).name)||'—'),fmt(x.qty),fmt(x.unit_price),`<input id="rq${i}" type="number" step="0.001" min="0" value="0" style="width:110px">`]))}<div class="row"><button onclick="retSave()">حفظ المرتجع</button><button class="s" onclick="RT=null;R('soft')">إلغاء</button></div></div>`:'';
  const rows=RS.slice().reverse().map(x=>[e(x.number),x.date,e((by(L,x.invoice_id).number)||'—'),e((by(sel?C.customers:C.suppliers,sel?x.customer_id:x.supplier_id).name)||'—'),fmt(x.total),`<button class="s" onclick="retPrint('${x.id}',${sel})">طباعة</button>`]);
  return sectionHead('المرتجعات','مرتجع مرتبط بفاتورة، يُحفظ ويُطبع كمستند.')+
    `<div class="card np"><div class="row"><select id="rk" onchange="window._rk=v('rk');window._rp=null;RT=null;R('soft')"><option value="s" ${sel?'selected':''}>مرتجع مبيعات</option><option value="p" ${sel?'':'selected'}>مرتجع مشتريات</option></select><select id="ri">${L.slice().reverse().map(x=>`<option value="${x.id}">${e(x.number)} — ${fmt(x.total)}</option>`).join('')}</select><button class="s" onclick="loadRet()">عرض البنود</button></div></div>${itemsHtml}<div class="card"><b>المرتجعات المسجلة</b>${T(['الرقم','التاريخ','الفاتورة','الطرف','الإجمالي',''],rows)}</div>`;
}

const LEDGER_SRC={create_sale:'فاتورة بيع',create_purchase:'فاتورة شراء',record_payment:'تحصيل / دفع',create_expense:'مصروف',transfer_cash:'تحويل بين الحسابات',pay_payroll:'دفع مرتب',cancel_sales_invoice:'إلغاء فاتورة',edit_sales_invoice:'تعديل فاتورة',create_sales_return:'مرتجع بيع',create_purchase_return:'مرتجع شراء',record_cheque:'شيك',update_cheque_status:'تحصيل شيك',reconcile_bank_line:'مطابقة بنك',capitalize_fixed_asset:'رسملة أصل',dispose_fixed_asset:'استبعاد أصل'};
async function cashLedgerHtml(){
  const day=dyGet('led');const[a,b]=dayRange(day);
  const[res,PN]=await Promise.all([sb.from('cash_movements').select('*').gte('created_at',a).lt('created_at',b).order('created_at',{ascending:false}).limit(3000),profNames()]);
  if(res.error)throw res.error;
  const L=(res.data||[]).filter(x=>cday(x.created_at)===day);
  const an=id=>(by(C.accts,id).name)||'—';
  let tin=0,tout=0;L.forEach(x=>{if(x.direction==='in')tin+=+x.amount;else tout+=+x.amount});
  const tm=x=>new Date(x.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Cairo'});
  const rows=L.map(x=>[tm(x),e(an(x.account_id)),x.direction==='in'?'<span class="good">داخل ＋</span>':'<span class="bad">خارج −</span>',fmt(x.amount),e(LEDGER_SRC[x.source]||x.source||'—'),e(PN[x.user_id]||'—')]);
  const texts=L.map(x=>[an(x.account_id),LEDGER_SRC[x.source]||x.source||'',PN[x.user_id]||'',x.direction==='in'?'داخل':'خارج'].join(' '));
  const dl=new Date(day+'T12:00:00Z').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Africa/Cairo'});
  ptStore('led','حركة الخزينة — '+dl,'',['الوقت','الحساب','الاتجاه','المبلغ','المصدر','المستخدم'],L.map(x=>[tm(x),e(an(x.account_id)),x.direction==='in'?'داخل':'خارج',fmt(x.amount),e(LEDGER_SRC[x.source]||x.source||'—'),e(PN[x.user_id]||'—')]),`<p class="tot">داخل: ${fmt(tin)} · خارج: ${fmt(tout)} · الصافي: ${fmt(tin-tout)}</p>`);
  return `${dayStrip('led',day)}<div class="card"><div class="card-title"><b>حركة ${e(dl)}</b><div class="row"><span class="chip success">داخل ${fmt(tin)}</span><span class="chip danger">خارج ${fmt(tout)}</span><span class="chip info">الصافي ${fmt(tin-tout)}</span><button class="s" onclick="ptPrint('led')">طباعة هذا اليوم</button></div></div>${lsCard('led',['الوقت','الحساب','الاتجاه','المبلغ','المصدر','المستخدم'],rows,texts,'ابحث بالحساب أو المصدر أو المستخدم...')}</div>`;
}

async function auditView(){

  const from14=new Date(Date.now()-14*86400000).toISOString();

  if(ov.error)throw ov.error;if(q1.error)throw q1.error;
  const cnt={};(ov.data||[]).forEach(x=>{const d=cday(x.created_at);cnt[d]=(cnt[d]||0)+1});
  const L=(q1.data||[]).filter(x=>cday(x.created_at)===day);

  const texts=L.map(x=>[x.user_name||'',auAct(x.action),auEnt(x.entity),x.description||''].join(' '));
  const dl=new Date(day+'T12:00:00Z').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Africa/Cairo'});
  const bar=secBar('aud',[['log','سجل العمليات'],['mv','حركات المخزون']],'log');
  let body;

    const mv=await mvHtml(day,PN);
    body=`<div class="card"><div class="card-title"><b>حركات المخزون — ${e(dl)}</b><button class="s" onclick="ptPrintLS('mv','حركات المخزون — ${e(dl)}')">طباعة هذا اليوم</button></div>${mv}</div>`;
  } else {
    body=`<div class="card"><div class="card-title"><b>عمليات ${e(dl)}</b><div class="row"><span class="chip ${day===today?'info':'success'}">${day===today?'اليوم (مفتوح)':'يوم مقفول'} · ${L.length} عملية</span><button class="s" onclick="ptPrintLS('audit','سجل العمليات — ${e(dl)}')">طباعة هذا اليوم</button></div></div>${lsCard('audit',['الوقت','المستخدم','نوع العملية','الجزء المتأثر','التفاصيل'],rows,texts,'ابحث باسم المستخدم أو نوع العملية أو التفاصيل...')}</div>`;
  }

      <textarea id="en" rows="2" placeholder="تفاصيل إضافية (اختياري): مين اتدفعله، رقم الفاتورة، ملاحظات" style="width:100%;margin-top:10px"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="act(()=>rpc('create_expense',{p_category:v('ec'),p_desc:v('ed')||null,p_amount:n('ea'),p_account:v('ex'),p_notes:v('en')||null}))">حفظ المصروف</button></div></div>`+
    dayStrip('exp',day,d=>fmt(sumOf(d)))+
    `<div class="card"><div class="card-title"><b>مصروفات ${e(dl)}</b><div class="row"><span class="chip info">الإجمالي ${fmt(tot)}</span><button class="btn" onclick="ptPrint('exp')">🖨 طباعة مصروفات هذا اليوم</button></div></div>${T(['التصنيف','الوصف','التفاصيل','المبلغ','الحساب'],cells)}</div>`;
}

// ---------- الخزينة: أسماء المصادر (بما فيها الحركات القديمة المرحّلة) ----------
Object.assign(LEDGER_SRC,{record_initial_payment:'دفعة مع فاتورة',backfill_payment:'دفعة (قبل التحديث)',backfill_expense:'مصروف (قبل التحديث)',backfill_transfer:'تحويل (قبل التحديث)',backfill_payroll:'مرتب (قبل التحديث)'});


// ---------- v1.47: تسجيل الدخول، القائمة الجانبية، أرصدة الخزينة، المرتجع بالعميل ----------
// 1) الدخول: رسالة واضحة لو البيانات غلط أو في مشكلة اتصال
function loginMsg(t){let el=document.getElementById('lerr');if(!el){el=document.createElement('div');el.id='lerr';el.setAttribute('role','alert');el.style.cssText='color:#b42318;background:#fef3f2;border:1px solid #fecdca;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;font-weight:700';document.querySelector('.login-card')?.appendChild(el)}el.textContent=t||'';el.hidden=!t}
async function login(){
  const email=(v('lu')||'').trim(),pass=v('lp')||'';
  loginMsg('');
  if(!email||!pass)return loginMsg('اكتب البريد الإلكتروني وكلمة المرور');
  try{
    await withLoading(async()=>{const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;await boot()},'جاري تسجيل الدخول...','جارٍ الاتصال بالنظام بأمان');
  }catch(x){
    const m=String(x?.message||x?.error_description||x||'');
    if(/invalid login|invalid_credentials|invalid.*(credential|password)/i.test(m))return loginMsg('البريد الإلكتروني أو كلمة المرور غلط');
    if(/email not confirmed/i.test(m))return loginMsg('الحساب لسه متفعلش. كلم الأدمن');
    if(/fetch|network|failed to/i.test(m))return loginMsg('مفيش اتصال بالسيرفر. اتأكد من الإنترنت وحاول تاني');
    loginMsg('تعذر تسجيل الدخول: '+m);
  }
}
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.target?.id==='lu'||ev.target?.id==='lp')&&document.getElementById('lp'))login()});

// 2) القائمة الجانبية: تتحدّث فوراً بدون إعادة تحميل كل البيانات
function navPaintNow(){const l=renderNavGroups();const nv=$('nav');if(nv){nv.innerHTML=l;window._lastLinks=l}const mb=$('.mobile-bottom');if(mb)mb.innerHTML=bottomNav()}
function navGo(){if(C&&me&&me.active&&can(view)){const stale=Date.now()-(window._lastLoad||0)>=60000;const p=paintView('soft');if(stale)loadAll(true).then(()=>paintView('soft')).catch(()=>{});return p}return R('soft')}
function go(vw){window.ixMode={};if(vw!==view){window._nav=window._nav||[];window._nav.push(view);if(window._nav.length>20)window._nav.shift()}view=vw;localStorage.setItem('erp_v_view',vw);closeMobileNav?.();navPaintNow();showPlaceholder();return navGo()}
function goBack(){const p=(window._nav||[]).pop();if(!p)return;view=p;localStorage.setItem('erp_v_view',p);closeMobileNav?.();navPaintNow();showPlaceholder();return navGo()}
function toggleNavGroup(gid,ev){ev.preventDefault();ev.stopPropagation();let state={};try{state=JSON.parse(localStorage.getItem('erp_v_nav_groups')||'{}')}catch{};const open=state[gid]===false?true:state[gid]===undefined?true:false;Object.keys(state).forEach(k=>{state[k]=false});state[gid]=open;localStorage.setItem('erp_v_nav_groups',JSON.stringify(state));navPaintNow()}

// 3) الخزينة: الرصيد الافتتاحي والختامي لكل حساب ولكل يوم
// بداية اليوم بتوقيت القاهرة (بتحسب الصيف والشتا)
function cairoDayStart(day){const base=Date.parse(day+'T00:00:00Z');for(const off of [-2,-3,-1]){const t=base+off*3600e3;if(cday(t)===day&&cday(t-1)!==day)return new Date(t).toISOString()}return new Date(base-2*3600e3).toISOString()}
function nextDayKey(day){return new Date(Date.parse(day+'T12:00:00Z')+86400e3).toISOString().slice(0,10)}
async function cashLedgerHtml(){
  const day=dyGet('led');
  const a=cairoDayStart(day),b=cairoDayStart(nextDayKey(day));
  const[res,PN,obRows,cbRows]=await Promise.all([
    sb.from('cash_movements').select('*').gte('created_at',a).lt('created_at',b).order('created_at',{ascending:false}).limit(3000),
    profNames(),rpc('cash_balances_at',{p_ts:a}),rpc('cash_balances_at',{p_ts:b})]);
  if(res.error)throw res.error;
  const L=res.data||[];
  const OB=Object.fromEntries((obRows||[]).map(x=>[x.account_id,+x.balance]));
  const CB=Object.fromEntries((cbRows||[]).map(x=>[x.account_id,+x.balance]));
  const an=id=>(by(C.accts,id).name)||'—';
  let tin=0,tout=0;L.forEach(x=>{if(x.direction==='in')tin+=+x.amount;else tout+=+x.amount});
  const tm=x=>new Date(x.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Cairo'});
  const dl=new Date(day+'T12:00:00Z').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Africa/Cairo'});
  // جدول الأرصدة لكل حساب
  const per=C.accts.map(acc=>{
    const mv=L.filter(x=>x.account_id===acc.id);
    const inn=mv.filter(x=>x.direction==='in').reduce((s,x)=>s+ +x.amount,0);
    const out=mv.filter(x=>x.direction!=='in').reduce((s,x)=>s+ +x.amount,0);
    const open=OB[acc.id]??0, close=CB[acc.id]??+acc.balance;
    return {acc,open,inn,out,close,diff:Math.round((close-(open+inn-out))*100)/100};
  });
  const sum=k=>per.reduce((s,r)=>s+r[k],0);
  const balRows=per.map(r=>[e(r.acc.name),fmt(r.open),`<span class="good">${fmt(r.inn)}</span>`,`<span class="bad">${fmt(r.out)}</span>`,`<b>${fmt(r.close)}</b>`,Math.abs(r.diff)>0.005?`<span class="bad" title="حركات قبل تسجيل الحركات في النظام">${fmt(r.diff)}</span>`:'<span class="muted">—</span>']);
  const balHead=['الحساب','الرصيد الافتتاحي','داخل','خارج','الرصيد الختامي (المقفول)','فرق غير مسجل'];
  balRows.push([`<b>الإجمالي</b>`,`<b>${fmt(sum('open'))}</b>`,`<b>${fmt(sum('inn'))}</b>`,`<b>${fmt(sum('out'))}</b>`,`<b>${fmt(sum('close'))}</b>`,'']);
  const balHtml=T(balHead,balRows);
  const rows=L.map(x=>[tm(x),e(an(x.account_id)),x.direction==='in'?'<span class="good">داخل ＋</span>':'<span class="bad">خارج −</span>',fmt(x.amount),e(LEDGER_SRC[x.source]||x.source||'—'),e(PN[x.user_id]||'—')]);
  const texts=L.map(x=>[an(x.account_id),LEDGER_SRC[x.source]||x.source||'',PN[x.user_id]||'',x.direction==='in'?'داخل':'خارج'].join(' '));
  ptStore('led','حركة الخزينة — '+dl,'',['الوقت','الحساب','الاتجاه','المبلغ','المصدر','المستخدم'],L.map(x=>[tm(x),e(an(x.account_id)),x.direction==='in'?'داخل':'خارج',fmt(x.amount),e(LEDGER_SRC[x.source]||x.source||'—'),e(PN[x.user_id]||'—')]),`<h3>أرصدة الحسابات</h3>${balHtml}<p class="tot">داخل: ${fmt(tin)} · خارج: ${fmt(tout)} · الصافي: ${fmt(tin-tout)}</p>`);
  return `${dayStrip('led',day)}<div class="card"><div class="card-title"><b>أرصدة ${e(dl)}</b><span class="muted">الافتتاحي = الرصيد أول اليوم، والختامي = الرصيد اللي اتقفل بيه اليوم</span></div>${balHtml}</div>`+
    `<div class="card"><div class="card-title"><b>حركة ${e(dl)}</b><div class="row"><span class="chip success">داخل ${fmt(tin)}</span><span class="chip danger">خارج ${fmt(tout)}</span><span class="chip info">الصافي ${fmt(tin-tout)}</span><button class="s" onclick="ptPrint('led')">طباعة هذا اليوم</button></div></div>${lsCard('led',['الوقت','الحساب','الاتجاه','المبلغ','المصدر','المستخدم'],rows,texts,'ابحث بالحساب أو المصدر أو المستخدم...')}</div>`;
}
